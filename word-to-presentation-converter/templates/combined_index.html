<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Converter + Corrector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            color: #555;
            font-size: 14px;
            padding: 6px 0;
            padding-left: 25px;
            position: relative;
        }

        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .upload-section {
            margin-bottom: 25px;
        }

        .upload-section label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 20px;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .file-input-label.has-file {
            background: #e7f3ff;
            border-color: #667eea;
            border-style: solid;
        }

        .file-name {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .file-placeholder {
            color: #999;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
        }

        .option-group label {
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .option-group select,
        .option-group input {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .option-group select:focus,
        .option-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 12px;
            color: #667eea;
            font-weight: 600;
            font-size: 15px;
        }

        .error-message {
            background: #ffe6e6;
            border-left: 4px solid #dc3545;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .error-message p {
            color: #dc3545;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Combined Converter <span class="badge">ALL-IN-ONE</span></h1>
        <p class="subtitle">Convert Word/PDF to PPTX with automatic spacing corrections</p>

        <div class="info-box">
            <h3>✨ What This Does:</h3>
            <ul>
                <li>Converts Word/PDF documents to PowerPoint</li>
                <li>Automatically fixes spacing errors</li>
                <li>Preserves fonts and formatting</li>
                <li>Returns corrected PPTX in one step</li>
            </ul>
        </div>

        <form id="convertForm" enctype="multipart/form-data">
            <div class="upload-section">
                <label for="file">Upload Document (Word or PDF)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="file" name="file" accept=".docx,.doc,.pdf" required>
                    <label for="file" class="file-input-label" id="fileLabel">
                        <span class="file-placeholder">📎 Click to select file (.docx, .doc, .pdf)</span>
                    </label>
                </div>
            </div>

            <div class="options-grid">
                <div class="option-group">
                    <label for="font_family">Font Family</label>
                    <select id="font_family" name="font_family">
                        <option value="Calibri">Calibri</option>
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Lucida Sans">Lucida Sans</option>
                    </select>
                </div>

                <div class="option-group">
                    <label for="font_size">Font Size</label>
                    <input type="number" id="font_size" name="font_size" value="36" min="12" max="72">
                </div>

                <div class="option-group">
                    <label for="line_spacing">Line Spacing</label>
                    <input type="number" id="line_spacing" name="line_spacing" value="1.25" min="1.0" max="3.0" step="0.05">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                🎯 Convert & Correct
            </button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Processing...</div>
        </div>

        <div class="error-message" id="errorMessage">
            <p id="errorText"></p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const fileLabel = document.getElementById('fileLabel');
        const form = document.getElementById('convertForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        const progressStages = [
            { pct: 15, text: "Parsing document..." },
            { pct: 35, text: "Detecting questions..." },
            { pct: 55, text: "Creating slides..." },
            { pct: 75, text: "Applying formatting..." },
            { pct: 85, text: "Correcting spacing..." },
            { pct: 95, text: "Finalizing presentation..." },
        ];

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileLabel.classList.add('has-file');
                fileLabel.innerHTML = `<span class="file-name">📎 ${this.files[0].name}</span>`;
            } else {
                fileLabel.classList.remove('has-file');
                fileLabel.innerHTML = '<span class="file-placeholder">📎 Click to select file (.docx, .doc, .pdf)</span>';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            errorMessage.classList.remove('show');

            if (!fileInput.files.length) {
                showError('Please select a file');
                return;
            }

            submitBtn.disabled = true;
            progressContainer.style.display = 'block';

            const formData = new FormData(form);

            let currentStage = 0;
            const progressInterval = setInterval(() => {
                if (currentStage < progressStages.length) {
                    const stage = progressStages[currentStage];
                    progressFill.style.width = stage.pct + '%';
                    progressText.textContent = stage.text;
                    currentStage++;
                }
            }, 800);

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Conversion failed');
                }

                progressFill.style.width = '100%';
                progressText.textContent = 'Preparing download...';

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileInput.files[0].name.replace(/\.(docx?|pdf)$/i, '_CORRECTED.pptx');
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                progressText.textContent = '✅ Download complete!';

                setTimeout(() => {
                    resetForm();
                }, 2000);

            } catch (error) {
                clearInterval(progressInterval);
                console.error('Error:', error);
                showError(error.message);
                resetForm();
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        function resetForm() {
            submitBtn.disabled = false;
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
        }
    </script>
</body>
</html>
